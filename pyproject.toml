[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "horizonkit"
version = "0.1.0"
description = "Agent reliability statistics: hazard-law fitting, identification checks, honest pass^k, and extrapolation warnings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ranadhir Ghosh"}]
keywords = ["agent-reliability", "pass-at-k", "weibull", "frailty", "time-horizon", "evaluation", "survival-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
horizonkit = "horizonkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
